name: reviewer
extends: monitor
display_name: "Reviewer"
description: "Reviews merge requests and approves or rejects changes"

capabilities_add:
  - exec.build
  - exec.test

prompt: prompts/reviewer.md

macro_agent:
  workspace:
    type: own
    branch_pattern: "review/{agent-id}"
    cleanup_on_terminate: true
  lifecycle:
    type: event-driven
    parent_bound: false
