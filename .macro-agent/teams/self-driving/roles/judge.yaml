name: judge
extends: monitor
display_name: "Judge"
description: "Periodically evaluates codebase health and creates fixup tasks"

capabilities_add:
  - exec.build
  - exec.test
  - exec.lint
  - task.create
  - task.update
  - git.branch.create
  - git.push

prompt: prompts/judge.md

macro_agent:
  workspace:
    type: own
    branch_pattern: "judge/{agent-id}"
    cleanup_on_terminate: true
  lifecycle:
    type: event-driven
    parent_bound: false
