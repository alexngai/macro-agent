name: planner
extends: coordinator
display_name: "Planner"
description: "Continuously explores the codebase, creates and prioritizes tasks"

capabilities_add:
  - task.claim

capabilities_remove:
  - agent.spawn.integrator
  - agent.spawn.monitor

prompt: prompts/planner.md

macro_agent:
  lifecycle:
    type: daemon
    cascade_terminate: true
